<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="18_transisiones.css">
    <title>Transiciones en una pista de autos</title>
</head>
<body>
    <main>
        <h1>Centro de servicio automotriz</h1>
        <p>Coloca el cursor sobre el botón para ver la transición.</p>
        <button class="boton-jedi">Solicitar revisión</button>

        <div class="tarjeta" tabindex="0">
            <h2>Auto compacto</h2>
            <p>Listo para tu próximo viaje</p>
        </div>

        <h1>Garaje de autos</h1>
        <div class="hangar">
            <div class="nave">🚗 Auto</div>
        </div>

        <h1>Indicador de combustible</h1>
        <div class="radar">
            <div class="indicador" aria-label="Indicador">➤</div>
        </div>

        <h1>Salida del garaje</h1>
        <div class="hangar2">
            <div class="nave2">🚙 SUV</div>
        </div>

        <h1>Prueba en la pista</h1>
        <div class="espacio">
            <div class="X-Wing">🏎️ Auto de carreras</div>
        </div>

        <div class="alerta">Revisión de seguridad</div>
    </main>
</body>
</html>
