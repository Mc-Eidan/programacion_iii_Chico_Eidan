<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de alquiler</title>
</head>
<body>
    <h1>Catálogo de vehículos</h1>
    <table border="1">
        <caption>Vehículos disponibles</caption>
        <thead>
            <tr>
                <th scope="col">Modelo</th>
                <th scope="col">Categoría</th>
                <th scope="col">Precio por día</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nissan Versa</td>
                <td>Compacto</td>
                <td>$650</td>
            </tr>
            <tr>
                <td>Toyota Corolla</td>
                <td>Sedán</td>
                <td>$850</td>
            </tr>
            <tr>
                <td>Hyundai Tucson</td>
                <td>SUV</td>
                <td>$1,200</td>
            </tr>
        </tbody>
    </table>

    <h2>Resumen de tarifas</h2>
    <table border="1">
        <caption>Promociones de temporada</caption>
        <thead>
            <tr>
                <th scope="col">Plan</th>
                <th scope="col">Duración</th>
                <th scope="col">Descuento</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Fin de semana</td>
                <td>2 días</td>
                <td>10%</td>
            </tr>
            <tr>
                <td>Viaje largo</td>
                <td>7 días o más</td>
                <td>15%</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
