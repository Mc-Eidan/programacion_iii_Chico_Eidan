<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia de viaje</title>
    <style>
        iframe {
            border: 2px solid #315a73;
            border-radius: 8px;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Prepara tu viaje</h1>

    <h2>Video</h2>
    <video width="640" controls>
        <source src="../videos/videoplayback.mp4" type="video/mp4">
        Tu navegador no puede reproducir este video.
    </video>

    <h2>Audio</h2>
    <audio src="../music/No digas nada.mp3" controls>
        Tu navegador no puede reproducir este audio.
    </audio>

    <h2>Información para viajeros</h2>
    <iframe
        src="https://es.wikipedia.org/wiki/Turismo"
        width="640"
        height="400"
        title="Información sobre turismo">
    </iframe>

    <h2>Solicitud de renta</h2>
    <iframe
        src="10_formularios_mp_chico_eidan.html"
        width="640"
        height="500"
        title="Formulario de solicitud de renta">
    </iframe>
</body>
</html>
