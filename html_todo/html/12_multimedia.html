<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
    <style>
        iframe {
            border: 2px solid #333;
            border-radius: 8px;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Multimedia</h1>

    <h2>Reproducir Video</h2>
    <video width="1000" height="500" controls>
        <source src="videos/videoplayback.mp4" type="video/mp4">
        Tu navegador no soporta video HTML5.
    </video>

    <h2>Reproducir Sonido</h2>
    <audio src="music/No digas nada.mp3" controls muted>
        Actualiza tu navegador, no soporta HTML5.
    </audio>

    <h1>Portal Galáctico</h1>

    <h2>Información Académica Jedi</h2>
    <iframe
        src="https://es.wikipedia.org/wiki/Star_Wars"
        width="800"
        height="400"
        title="Información Jedi">
    </iframe>

    <h2>Formulario de Registro</h2>
    <iframe
        src="10_formularios.html"
        width="800"
        height="700"
        title="Formulario de registro">
    </iframe>
</body>
</html>
