<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>

<body>

    <form action="/registro" method="post">

        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre</label>
                    <br>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Luke">
                    <br>
                    <label for="password">Password</label>
                    <br>
                    <input type="password" id="password" name="password">
                    <br>
                    <label for="edad">Edad</label>
                    <br>
                    <input type="number" id="edad" name="edad" min="1">
                </td>
                <td>
                    <label for="apellido">Apellido</label>
                    <br>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej. Skywalker">
                    <br>
                    <label for="confirmar">Confirmar Password</label>
                    <br>
                    <input type="password" id="confirmar" name="confirmar">
                    <br>
                    <label for="nivel">Nivel de la Fuerza</label>
                    <br>
                    <input type="number" id="nivel" name="nivel" min="10" max="100" value="50" step="5">
                </td>
            </tr>
            <tr>
                <td>
                    <p>Seleccione tu bando:</p>
                    <input type="radio" id="jedi" name="bando" value="jedi">
                    <label for="jedi">Jedi</label>
                    <input type="radio" id="sith" name="bando" value="sith">
                    <label for="sith">Sith</label>
                </td>
                <td>
                    <p>Seleccione tus habilidades:</p>
                    <br>
                    <input type="checkbox" id="fuerza" name="habilidades" value="fuerza">
                    <label for="fuerza">Uso de la Fuerza</label>
                    <br>
                    <input type="checkbox" id="sable" name="habilidades" value="sable">
                    <label for="sable">Uso de la Sable</label>
                    <br>
                    <input type="checkbox" id="levitar" name="habilidades" value="levitar">
                    <label for="levitar">Levitar</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="planeta">Planeta de Origen</label>
                    <br>
                    <select id="planeta" name="planeta">
                        <option value="">Selecciona un Planeta</option>
                        <option value="tatooine">Tatooine</option>
                        <option value="coruscant">Coruscant</option>
                        <option value="naboo">Naboo</option>
                        <option value="alderaan">Alderaan</option>
                    </select>
                </td>
                <td>
                    <label for="droide">Droide</label>
                    <br>
                    <select id="droide" name="droide" size="2">
                        <option value="">Selecciona un Droide</option>
                        <option value="c3po">C3PO</option>
                        <option value="r2d2">R2-D2</option>
                        <option value="bb8">BB-8</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <fieldset>
                        <legend>Datos Generales</legend>
                        <label for="misiones">Misiones</label>
                        <br>
                        <input type="number" id="misiones" name="misiones" min="0">
                        <br>
                        <label for="vuelos">Vuelos</label>
                        <br>
                        <input type="number" id="vuelos" name="vuelos" min="0">
                    </fieldset>
                </td>
            </tr>
        </table>

        <button type="submit">Enviar</button>
        <button type="reset">Reset</button>

    </form>

</body>

</html>
