<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="03_colores.css">
    <title>Colores</title>
    <style>
        body{
            background-color: darksalmon;
        }
        h1{
            color:red;
        }
        h2{
            color: #ff0000;
        }
        h3{
            color: rgb(252, 0, 0);
        }
        h4{
            color: rgba(255, 0, 0,0.8);
        }
        h5{
            color: hsl(0, 100%, 50%);
        }
    </style>
</head>
<body>
    <h1>Maneras de establecer colores</h1>
    <h1>Por nombre del color</h1>
    <h2>Hexadecimal</h2>
    <h3>RGB</h3>
    <h4>RGBA</h4>
    <h5>HSL</h5>
</body>
</html>
