<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pista de pruebas de autos</title>
    <link rel="stylesheet" href="19_trancisiones_integraciones.css">
</head>
<body>
    <header>
        <h1>Pista de pruebas</h1>
        <p>Simulación de conducción y seguridad automotriz.</p>
    </header>

    <main>
        <section class="escena" aria-label="Pista de pruebas animada">
            <div class="estrella estrella1"></div>
            <div class="estrella estrella2"></div>
            <div class="estrella estrella3"></div>
            <div class="estrella estrella4"></div>
            <div class="estrella estrella5"></div>

            <div class="nave">
                <span aria-hidden="true">🚗</span>
                <p>Auto de prueba</p>
            </div>

            <div class="alerta">PRECAUCIÓN</div>
        </section>

        <section class="controles">
            <h2>Centro de control</h2>
            <div class="panel">
                <article class="radar-contenedor">
                    <h3>Sensor de estacionamiento</h3>
                    <div class="radar" aria-hidden="true">
                        <div class="pulso"></div>
                        <div class="centro"></div>
                    </div>
                </article>

                <article class="estado">
                    <h3>Estado de la prueba</h3>
                    <p>Recorrido de prueba activo.</p>
                    <p>Vehículo: auto compacto</p>
                    <p>Ubicación: pista de pruebas</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>Centro de pruebas automotrices - 2026</p>
    </footer>
</body>
</html>
