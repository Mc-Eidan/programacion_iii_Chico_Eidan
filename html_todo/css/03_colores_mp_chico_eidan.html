<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores para alquiler de autos</title>
    <style>
        body {
            background-color: #f4f1de;
        }

        h1 {
            color: darkgreen;
        }

        .nombre {
            color: steelblue;
        }

        .hexadecimal {
            color: #e76f51;
        }

        .rgb {
            color: rgb(38, 70, 83);
        }

        .rgba {
            color: rgba(42, 157, 143, 0.8);
        }

        .hsl {
            color: hsl(38, 90%, 45%);
        }
    </style>
</head>
<body>
    <h1>Colores de nuestra flota de alquiler</h1>
    <h2 class="nombre">Auto compacto azul disponible</h2>
    <h2 class="hexadecimal">SUV naranja para alquilar</h2>
    <h2 class="rgb">Sedán gris de la flota</h2>
    <h2 class="rgba">Reserva con tarifa transparente</h2>
    <h2 class="hsl">Auto económico listo para rentar</h2>
</body>
</html>
