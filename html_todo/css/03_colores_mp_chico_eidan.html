<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores para viajar</title>
    <style>
        body {
            background-color: #f4f1de;
        }

        h1 {
            color: darkgreen;
        }

        .nombre {
            color: steelblue;
        }

        .hexadecimal {
            color: #e76f51;
        }

        .rgb {
            color: rgb(38, 70, 83);
        }

        .rgba {
            color: rgba(42, 157, 143, 0.8);
        }

        .hsl {
            color: hsl(38, 90%, 45%);
        }
    </style>
</head>
<body>
    <h1>Colores para una página de viajes</h1>
    <h2 class="nombre">Color por nombre: destinos azules</h2>
    <h2 class="hexadecimal">Color hexadecimal: aventura naranja</h2>
    <h2 class="rgb">Color RGB: ruta verde azulada</h2>
    <h2 class="rgba">Color RGBA: paisaje translúcido</h2>
    <h2 class="hsl">Color HSL: sol de carretera</h2>
</body>
</html>
