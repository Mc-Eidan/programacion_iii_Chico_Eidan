<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a JavaScript</title>
    <script>
        !alert('Bienvenido a la pagina de alquiler de autos');
        console.log('Bienvenido a la pagina de alquiler de autos');
    </script>
</head>
<body>
    <h1>Introducción a JavaScript</h1>
    <h2>Modo inline</h2>
    <button onclick="alert('¡Bienvenido a la página de alquiler de autos!')">
        Mostrar Mensaje
    </button>
    <input type="text" placeholder="Escribe aquí (mira la consola)" 
       oninput="console.log('Escribiendo:', this.value);">
    <input type="text" placeholder="Escribe y sal del cuadro"
    onchange="this.style.backgroundColor = 'lightgreen'; alert('Saliste del cuadro con el valor: ' + this.value);">
    <script src="01_incluir_mp_eidan_chico.js"></script>
</body>
</html>
